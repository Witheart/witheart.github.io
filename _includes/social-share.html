{% assign locale = include.locale | default: site.locale %}
<section class="page__share">
  <h4 class="page__share-title">{{ site.data.ui-text[locale].share_on_label | default: "分享" }}</h4>

  <a href="#" class="btn btn--copy-link" onclick="copyPageLink(event)" title="复制链接">
    <i class="fas fa-fw fa-link" aria-hidden="true"></i><span> 复制链接</span>
  </a>

  <a href="#" class="btn btn--wechat" onclick="toggleWechatQr(event)" title="微信扫码分享">
    <svg viewBox="0 0 24 24" width="0.95em" height="0.95em" fill="currentColor" aria-hidden="true" style="vertical-align:-0.125em"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.27-.027-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/></svg><span> 微信</span>
  </a>

  <a href="https://sns.qzone.qq.com/cgi-bin/qzshare/cgi_qzshare_onekey?url={{ page.url | absolute_url | url_encode }}&title={{ page.title | url_encode }}" class="btn btn--qzone" target="_blank" rel="noopener" title="分享到 QQ空间">
    <i class="fab fa-fw fa-qq" aria-hidden="true"></i><span> QQ空间</span>
  </a>

  <a href="https://service.weibo.com/share/share.php?url={{ page.url | absolute_url | url_encode }}&title={{ page.title | url_encode }}" class="btn btn--weibo" target="_blank" rel="noopener" title="分享到微博">
    <i class="fab fa-fw fa-weibo" aria-hidden="true"></i><span> 微博</span>
  </a>

  <a href="https://blog.csdn.net/Beihai_Van" class="btn btn--csdn" target="_blank" rel="noopener" title="访问我的 CSDN 博客">
    <i class="fas fa-fw fa-c" aria-hidden="true"></i><span> CSDN</span>
  </a>
</section>

<div id="wechat-qr-modal" class="wechat-qr-modal" style="display:none">
  <div class="wechat-qr-box">
    <p class="wechat-qr-title">微信扫一扫，分享本文</p>
    <div id="wechat-qr-code"></div>
    <button type="button" class="btn btn--primary" onclick="hideWechatQr()">关闭</button>
  </div>
</div>

<script>
(function () {
  var pageUrl = {{ page.url | absolute_url | jsonify }};

  window.copyPageLink = function (e) {
    if (e) e.preventDefault();
    function done() {
      var span = document.querySelector('.btn--copy-link span');
      if (span) {
        var old = span.textContent;
        span.textContent = ' 已复制';
        setTimeout(function () { span.textContent = old; }, 1500);
      }
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = pageUrl;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (err) { window.prompt('复制链接：', pageUrl); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(pageUrl).then(done, fallback);
    } else {
      fallback();
    }
  };

  window.hideWechatQr = function () {
    var m = document.getElementById('wechat-qr-modal');
    if (m) m.style.display = 'none';
  };

  window.toggleWechatQr = function (e) {
    if (e) e.preventDefault();
    var m = document.getElementById('wechat-qr-modal');
    var box = document.getElementById('wechat-qr-code');
    if (!m || !box) return;
    m.style.display = 'flex';
    if (box.getAttribute('data-url') === pageUrl) return;
    box.setAttribute('data-url', pageUrl);
    box.innerHTML = '';
    function gen() {
      if (typeof window.QRCode === 'undefined') return;
      new window.QRCode(box, { text: pageUrl, width: 180, height: 180, correctLevel: 2 });
    }
    if (typeof window.QRCode === 'undefined') {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';
      s.onload = gen;
      document.head.appendChild(s);
    } else {
      gen();
    }
  };
})();
</script>
