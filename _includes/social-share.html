{% assign locale = include.locale | default: site.locale %}
<section class="page__share">
  <h4 class="page__share-title">{{ site.data.ui-text[locale].share_on_label | default: "分享" }}</h4>

  <a href="#" id="js-copy-link" class="btn" style="background-color:#6a737d;color:#fff" onclick="copyPageLink(event)" title="复制链接">
    <i class="fas fa-fw fa-link" aria-hidden="true"></i><span> 复制链接</span>
  </a>

  <a href="https://sns.qzone.qq.com/cgi-bin/qzshare/cgi_qzshare_onekey?url={{ page.url | absolute_url | url_encode }}&title={{ page.title | url_encode }}" class="btn" style="background-color:#12b7f5;color:#fff" target="_blank" rel="noopener" title="分享到 QQ空间">
    <i class="fab fa-fw fa-qq" aria-hidden="true"></i><span> QQ空间</span>
  </a>

  <a href="https://service.weibo.com/share/share.php?url={{ page.url | absolute_url | url_encode }}&title={{ page.title | url_encode }}" class="btn" style="background-color:#e6162d;color:#fff" target="_blank" rel="noopener" title="分享到微博">
    <i class="fab fa-fw fa-weibo" aria-hidden="true"></i><span> 微博</span>
  </a>
</section>

<script>
(function () {
  var pageUrl = {{ page.url | absolute_url | jsonify }};

  window.copyPageLink = function (e) {
    if (e) e.preventDefault();
    function done() {
      var span = document.querySelector('#js-copy-link span');
      if (span) {
        var old = span.textContent;
        span.textContent = ' 已复制';
        setTimeout(function () { span.textContent = old; }, 1500);
      }
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = pageUrl;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (err) { window.prompt('复制链接：', pageUrl); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(pageUrl).then(done, fallback);
    } else {
      fallback();
    }
  };
})();
</script>
